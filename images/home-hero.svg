<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <!-- 홈 히어로 일러스트: 클래스 6종(도자기·베이킹·가죽공예·플라워·드로잉·향수)을 작업대 위 사물로 표현 -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .f { animation: bob 5s ease-in-out infinite; }
      .d1 { animation-delay: -0.8s; } .d2 { animation-delay: -1.6s; }
      .d3 { animation-delay: -2.4s; } .d4 { animation-delay: -3.2s; } .d5 { animation-delay: -4s; }
    }
    @keyframes bob { 50% { transform: translateY(-8px); } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="760" height="440" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="760" height="440" fill="#1f2a44"/>
    <rect y="330" width="760" height="110" fill="#2a3757"/>

    <!-- 도자기: 컵 -->
    <g class="f">
      <path d="M160 255 q36 0 31 36 q-4 26 -38 26" fill="none" stroke="#2f6f62" stroke-width="12" stroke-linecap="round"/>
      <path d="M78 230 h84 l-9 100 h-66 z" fill="#2f6f62"/>
      <ellipse cx="120" cy="230" rx="42" ry="8" fill="#3f8a7a"/>
    </g>

    <!-- 베이킹: 빵 -->
    <g class="f d1">
      <rect x="205" y="266" width="130" height="64" rx="32" fill="#d4b483"/>
      <path d="M240 280 l14 30 M268 278 l14 32 M296 280 l14 30" stroke="#a9874f" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- 가죽공예: 카드지갑 -->
    <g class="f d2">
      <rect x="362" y="262" width="92" height="68" rx="6" fill="#7b4f36"/>
      <rect x="370" y="270" width="76" height="52" rx="3" fill="none" stroke="#d4b483" stroke-width="2" stroke-dasharray="5 5"/>
    </g>

    <!-- 플라워: 꽃병 -->
    <g class="f d3">
      <path d="M515 285 L496 192 M515 285 L515 172 M515 285 L540 196" stroke="#2f6f62" stroke-width="5" stroke-linecap="round"/>
      <circle cx="496" cy="190" r="15" fill="#fbfbf8"/><circle cx="496" cy="190" r="5" fill="#d4b483"/>
      <circle cx="515" cy="168" r="15" fill="#fbfbf8"/><circle cx="515" cy="168" r="5" fill="#d4b483"/>
      <circle cx="541" cy="193" r="15" fill="#fbfbf8"/><circle cx="541" cy="193" r="5" fill="#d4b483"/>
      <rect x="490" y="278" width="50" height="52" rx="8" fill="#d9dbe2"/>
    </g>

    <!-- 향수: 병 -->
    <g class="f d4">
      <rect x="626" y="212" width="38" height="22" rx="4" fill="#2f6f62"/>
      <rect x="633" y="232" width="24" height="20" fill="#d9dbe2"/>
      <rect x="605" y="250" width="80" height="80" rx="14" fill="#d9dbe2"/>
      <rect x="613" y="288" width="64" height="34" rx="9" fill="#9cc3b9"/>
    </g>

    <!-- 드로잉: 작업대 앞쪽에 놓인 연필 -->
    <g class="f d5">
      <rect x="292" y="368" width="12" height="18" fill="#d9dbe2"/>
      <rect x="304" y="368" width="140" height="18" fill="#d4b483"/>
      <path d="M444 368 L468 377 L444 386 z" fill="#fbfbf8"/>
      <path d="M461 374.5 L468 377 L461 379.5 z" fill="#1f2a44"/>
    </g>
  </g>
</svg>
